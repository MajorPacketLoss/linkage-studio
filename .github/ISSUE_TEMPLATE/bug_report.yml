name: Bug report
description: Report a reproducible editor or analysis problem.
title: "[Bug] "
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include a small mechanism JSON file or an example name and input pose where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include units and an independent calculation for numerical discrepancies.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Screenshots or additional context
      description: Remove private information from attached files and screenshots.
